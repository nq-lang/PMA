[project]
name = "options-payoff-terminal"
version = "0.1.0"
description = "Local-first, simulation-only options strategy payoff visualization terminal (educational tool, no live market data or brokerage connectivity)."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.5",
    "scipy==1.18.1",
    "nicegui==4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
